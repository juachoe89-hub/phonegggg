<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Character Phone</title>
<style>
:root{--ink:#17191f;--muted:#7b8190;--blue:#1685ff;--line:#e8eaf0;--glass:rgba(255,255,255,.82)}
*{box-sizing:border-box}body{margin:0;background:#e9edf4;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
button,input,textarea{font:inherit}button{cursor:pointer;border:0}
.phone{width:min(410px,100%);height:min(850px,calc(100dvh - 24px));min-height:590px;background:#101116;border:7px solid #17181c;border-radius:48px;padding:8px;box-shadow:0 25px 70px #18243a45;position:relative;overflow:hidden}
.screen{height:100%;width:100%;border-radius:35px;overflow:hidden;position:relative;background:#f7f8fb;display:flex;flex-direction:column}
.status{height:38px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-weight:700;font-size:14px;z-index:3}
.status .right{display:flex;gap:5px;align-items:center;font-size:12px}
.dynamic{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:92px;height:25px;border-radius:18px;background:#08090b;z-index:4}
.view{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;flex-direction:column}
.homewall{background:linear-gradient(145deg,#76d6ff 0%,#2b8ef4 35%,#1655cb 70%,#0c2c74 100%);color:white}
.homewall:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 15% 20%,#ffffffa0,transparent 28%),radial-gradient(ellipse at 85% 48%,#a7ddff99,transparent 35%),linear-gradient(125deg,transparent 30%,#ffffff35 32%,transparent 36%,transparent 58%,#ffffff25 61%,transparent 65%);pointer-events:none}
.lockwall{background:linear-gradient(145deg,#91d9ff,#317bea 55%,#101f6e);color:white;align-items:center;justify-content:center;text-align:center}
.lock-time{font-size:68px;font-weight:300;letter-spacing:-3px;line-height:1.1}.lock-date{font-size:17px;margin-top:8px}
.lock-card{margin-top:42px;width:82%;background:#ffffff26;border:1px solid #ffffff50;border-radius:22px;padding:20px 15px;backdrop-filter:blur(15px)}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:220px;margin:18px auto 10px}.pinpad button{height:48px;border-radius:15px;background:#ffffff35;border:1px solid #ffffff70;color:white;font-size:22px}.pin-dots{display:flex;justify-content:center;gap:12px;margin:16px}.pin-dot{width:10px;height:10px;border-radius:50%;border:1px solid #fff}.pin-dot.filled{background:#fff}
.mini{font-size:12px;opacity:.85}
.home-top{position:relative;margin:26px 12px 22px;padding:20px 18px;border-radius:22px;background:#ffffff35;border:1px solid #ffffff5a;backdrop-filter:blur(14px);box-shadow:0 6px 20px #09316c25}
.weather{position:absolute;right:17px;top:20px;text-align:center;font-size:13px}.clock-big{font-size:53px;font-weight:300;letter-spacing:-2px}.date{font-size:14px;margin-top:2px}
.appgrid{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:20px 8px;padding:5px 13px;align-content:start;flex:1}
.app{background:transparent;color:inherit;display:flex;align-items:center;flex-direction:column;gap:6px;min-width:0;font-size:12px;text-shadow:0 1px 4px #17416b55}
.appicon{width:54px;height:54px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:28px;color:white;box-shadow:inset 0 2px 3px #ffffff99,0 3px 5px #0b2d623d;border:1px solid #ffffff70}
.appname{white-space:nowrap}
.dock{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:0 0 4px;padding:10px 5px 7px;background:#0b2d6570;border-top:1px solid #ffffff4c}
.dock .appicon{width:57px;height:57px}
.nav{height:22px;flex-shrink:0;background:#15161c;color:#aeb2bd;display:flex;align-items:center;justify-content:center}.nav button{display:none!important}.nav:after{content:"";width:94px;height:4px;border-radius:8px;background:#aeb2bd}
.nav button{display:none!important}
.appview{background:#f7f8fb;color:#17191f}
.apphead{display:flex;align-items:center;gap:12px;padding:12px 17px 14px;border-bottom:1px solid var(--line);flex-shrink:0}
.back{background:#eef1f6;border-radius:50%;width:36px;height:36px;font-size:22px;color:#303642}
.apphead h2{font-size:20px;margin:0;flex:1}
.content{overflow:auto;padding:14px 15px 24px;flex:1;min-height:0}
.subtle{color:var(--muted);font-size:13px}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:11px}.grow{flex:1;min-width:0}.pill{border-radius:20px;background:#edf4ff;color:#146bd3;padding:5px 9px;font-size:12px}
.person{width:39px;height:39px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#858585;color:white;font-size:22px;font-weight:800}.profile-big{width:92px;height:92px;border-radius:50%;background:#858585;color:white;display:flex;align-items:center;justify-content:center;font-size:55px;font-weight:800;margin:0 auto}
.itembtn{width:100%;text-align:left;background:white;padding:13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px;color:inherit}
.chatlog{display:flex;flex-direction:column;gap:9px;padding-bottom:12px}
.bubble{max-width:82%;padding:10px 12px;border-radius:17px;background:white;align-self:flex-start;line-height:1.4;overflow-wrap:anywhere;box-shadow:0 1px 2px #0000000a}
.bubble.me{align-self:flex-end;background:#1685ff;color:white;border-bottom-right-radius:5px}
.bubble.them{border-bottom-left-radius:5px}
.bubble small{display:block;font-size:10px;opacity:.65;margin-top:4px;text-align:right}
.composer{display:flex;gap:7px;padding:10px;border-top:1px solid var(--line);background:#f7f8fb;flex-shrink:0}
.composer input,.field{min-width:0;flex:1;border:1px solid #dfe3eb;border-radius:22px;padding:10px 13px;outline:none;background:white}
.send{background:var(--blue);color:white;border-radius:22px;padding:0 15px;font-weight:600}
.primary{background:var(--blue);color:white;border-radius:12px;padding:10px 14px}
.secondary{background:#edf0f5;color:#303642;border-radius:12px;padding:10px 14px}
textarea.field{width:100%;min-height:120px;resize:vertical;border-radius:14px}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.photo{aspect-ratio:1;border-radius:8px;background:linear-gradient(140deg,#8edfff,#3474e9);display:flex;align-items:center;justify-content:center;font-size:34px;color:white}
.photo:nth-child(3n+2){background:linear-gradient(145deg,#f4b3ce,#a778ed)}.photo:nth-child(3n){background:linear-gradient(145deg,#ffdb83,#ed8d52)}
.bigtime{text-align:center;font-size:54px;font-weight:300;margin:20px 0}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:270px;margin:18px auto}.keypad button{border-radius:50%;aspect-ratio:1;background:#e9edf5;font-size:24px}.contactline{padding:12px 0;border-bottom:1px solid var(--line)}
#toast{position:absolute;top:48px;left:15px;right:15px;z-index:10;background:#222c;color:white;padding:11px 14px;border-radius:13px;opacity:0;pointer-events:none;transition:.2s;font-size:13px}#toast.show{opacity:1}.notice-stack{position:absolute;top:42px;left:10px;right:10px;z-index:8;display:grid;gap:6px;pointer-events:none}.notice{background:#ffffffed;color:#17191f;border:1px solid #ffffff;border-radius:15px;padding:10px 13px;box-shadow:0 5px 18px #0002;font-size:13px;backdrop-filter:blur(15px)}.notice b{display:block;margin-bottom:3px}.appicon{position:relative}.ios-icon{font-size:28px;text-shadow:none;box-shadow:inset 0 1px 2px #ffffff99,0 2px 5px #0002}
.photos-icon{background:#fff!important;border:1px solid #e8e8ec;box-shadow:0 2px 5px #0002;overflow:hidden}
.photos-petal{position:absolute;width:15px;height:23px;border-radius:10px;background:#ff6259;left:19px;top:5px;transform-origin:8px 22px}
.photos-petal.p2{background:#ffb340;transform:rotate(60deg)}.photos-petal.p3{background:#ffdc42;transform:rotate(120deg)}.photos-petal.p4{background:#5bc96b;transform:rotate(180deg)}.photos-petal.p5{background:#43a7ff;transform:rotate(240deg)}.photos-petal.p6{background:#a77aff;transform:rotate(300deg)}.photos-center{position:absolute;width:12px;height:12px;background:white;border-radius:50%;left:21px;top:21px}
.day-divider{display:flex;align-items:center;gap:10px;color:#858a96;font-size:11px;margin:8px 0 4px;white-space:nowrap}.day-divider:before,.day-divider:after{content:'';height:1px;background:#dfe2e8;flex:1}
@media(max-height:680px){.home-top{margin:12px 10px;padding:12px 15px}.clock-big{font-size:42px}.appgrid{gap:11px 5px}.appicon{width:46px;height:46px}.dock .appicon{width:48px;height:48px}}
</style>
</head>
<body>
<div class="phone"><div class="screen">
<div class="dynamic"></div>
<div class="status"><span id="statusTime">9:41</span><span class="right">▮▮▮ ◉ ▰</span></div>
<div class="view" id="view"></div>
<div class="nav" id="nav"></div>
<div class="notice-stack" id="noticeStack"></div><div id="toast"></div>
</div></div>
<script>
const $=s=>document.querySelector(s);
const apps=[
 {id:'internet',name:'인터넷',icon:'🧭',color:'linear-gradient(#8ed4ff,#1765c7)'},
 {id:'calendar',name:'캘린더',icon:'19',color:'linear-gradient(#fff,#fff)',dark:true},
 {id:'notes',name:'메모',icon:'▤',color:'linear-gradient(#fff08a,#e3b921)',dark:true},
 {id:'clock',name:'시계',icon:'◷',color:'linear-gradient(#f5f6f8,#9ea6b5)',dark:true},
 {id:'gallery',name:'사진',icon:'🌈',color:'linear-gradient(#fff,#e8e8e8)',dark:true},
 {id:'music',name:'음악',icon:'♫',color:'linear-gradient(#e6a8ff,#8b30c8)'},
 {id:'phone',name:'전화',icon:'☎',color:'linear-gradient(#69dc85,#16a34a)'},
 {id:'contacts',name:'연락처',icon:'●',color:'linear-gradient(#ffbd84,#e66c31)'},
 {id:'messages',name:'메시지',icon:'●',color:'linear-gradient(#63e58a,#19b85b)',badge:'2'}
];
const people=[
 {id:'min',name:'무지창',initial:'무',desc:'오래 알고 지낸 친구'},
 {id:'jun',name:'삿가심',initial:'삿',desc:'친구'},
 {id:'ha',name:'금시완',initial:'금',desc:'친구'}
];
let unlocked=false,activeApp=null,stack=[],recentApps=[],selectedPerson='min',messages={},calls=[],notes='',sentCount=0;
let pinInput='', bootNoticesStarted=false, bootNoticesDone=false, swipeStart=null, chatChapterBusy=false, pendingDirect=null;
const initialMessages={
 min:[
 {from:'them',text:'피방 ㄱ?',time:'10/11 오후 12:34'}, {from:'me',text:'몇시',time:'오후 12:36'}, {from:'them',text:'늦었어',time:'오후 12:36'}, {from:'them',text:'2분이나 늦게 봤어',time:'오후 12:36'}, {from:'them',text:'닌끝이다 ㅅㄱ',time:'오후 12:37'}, {from:'me',text:'아니',time:'오후 12:37'}, {from:'them',text:'곤드레랑약속잡음',time:'오후 12:37'}, {from:'me',text:'ㅅㅂ그럼',time:'오후 12:37'}, {from:'me',text:'걍 같니 하면 되잖아',time:'오후 12:37'}, {from:'them',text:'ㅋㅋㅋㅋㅋ',time:'오후 12:37'}, {from:'them',text:'ㅋㅋ빨리 와',time:'오후 12:37'},
 {from:'me',text:'야',time:'오후 11:40'}, {from:'me',text:'야',time:'오후 11:40'}, {from:'me',text:'양ㅇ',time:'오후 11:40'}, {from:'me',text:'야',time:'오후 11:40'}, {from:'them',text:'아왜',time:'오후 11:46'}, {from:'me',text:'처신 잘해 닠ㅋㅋ',time:'오후 11:46'}, {from:'them',text:'뭔개솔?',time:'오후 11:46'}, {from:'me',text:'삿가심이 니 이상하대',time:'오후 11:46'}, {from:'me',text:'ㅈㄴ게이같대',time:'오후 11:47'}
 ],
 jun:[
 {from:'them',text:'야',time:'2026년 오후 11:28'}, {from:'me',text:'ㅇ?',time:'오후 11:35'}, {from:'them',text:'니머ㅜ함',time:'오후 11:36'}, {from:'me',text:'왜',time:'오후 11:36'}, {from:'them',text:'아니',time:'오후 11:38'}, {from:'them',text:'요즘 무지창 존나 상태이상해',time:'오후 11:38'}, {from:'me',text:'??',time:'오후 11:49'}, {from:'me',text:'새낔ㅋ뒷말하네',time:'오후 11:49'}, {from:'them',text:'아니 ㅅㅂ 그게 아니라',time:'오후 11:50'}, {from:'them',text:'됏다 ㅅㅂ',time:'오후 11:50'}
 ],
 ha:[
 {from:'me',text:'야 ㅅㅂ',time:'10/18 오후 4:10'}, {from:'me',text:'경쟁좀',time:'오후 4:10'}, {from:'me',text:'같이돌리자고미침새끼야',time:'오후 4:10'}, {from:'them',text:'ㄴㄴ ㅋㅋ',time:'오후 4:17'}, {from:'them',text:'니힘으로해내세요',time:'오후 4:17'}, {from:'me',text:'아 형',time:'오후 4:20'}, {from:'me',text:'치킨',time:'오후 4:20'}, {from:'me',text:'황금올리브',time:'오후 4:20'}, {from:'them',text:'몇판이겨주면됨',time:'오후 4:21'}
 ]
};
function resetData(){messages=JSON.parse(JSON.stringify(initialMessages));calls=[];notes='';sentCount=0}
resetData();
function timeNow(){return new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:true})}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function iconHTML(a){
 if(a.id==='gallery')return `<span class="appicon ios-icon photos-icon" aria-label="사진"><span class="photos-petal p1"></span><span class="photos-petal p2"></span><span class="photos-petal p3"></span><span class="photos-petal p4"></span><span class="photos-petal p5"></span><span class="photos-petal p6"></span><span class="photos-center"></span></span>`;
 const extra=a.id==='calendar'?'font-size:23px;font-weight:800;color:#fa4538;border-top:9px solid #fa4538;padding-top:5px':a.id==='messages'?'font-size:31px;color:white':a.id==='contacts'?'font-size:23px;color:white':'';return `<span class="appicon ios-icon" style="background:${a.color};${a.dark?'color:#454955':''};${extra}">${a.icon}</span>`
}
function appButton(a){return `<button class="app" data-app="${a.id}">${iconHTML(a)}<span class="appname">${a.name}</span></button>`}
function renderLock(){
 $('#nav').style.display='none';$('#view').className='view lockwall';pinInput='';
 $('#view').innerHTML=`<div class="lock-time" id="lockTime">9:41</div><div class="lock-date">월요일 · 10월 19일</div><div class="lock-card"><div style="font-size:15px">암호 입력</div><div class="pin-dots">${Array.from({length:4},(_,i)=>`<span class="pin-dot" data-pindot="${i}"></span>`).join('')}</div><div class="pinpad">${['1','2','3','4','5','6','7','8','9','⌫','0',''].map(n=>`<button data-pin="${n}">${n}</button>`).join('')}</div><div class="mini" id="pinHint">숫자 4자리를 입력하세요</div></div><div style="position:absolute;bottom:20px;font-size:12px;opacity:.8">가상 휴대폰</div>`;
 $$('[data-pin]').forEach(b=>b.onclick=()=>{const n=b.dataset.pin;if(!n)return;if(n==='⌫'){pinInput=pinInput.slice(0,-1)}else if(pinInput.length<4){pinInput+=n;if(pinInput.length===4){unlocked=true;renderHome();return}};$$('[data-pindot]').forEach((d,i)=>d.classList.toggle('filled',i<pinInput.length));});
 if(!bootNoticesStarted){bootNoticesStarted=true;setTimeout(()=>{messages.min.push({from:'them',text:'야',time:timeNow()});showNotice('무지창',['야']);setTimeout(()=>{messages.min.push({from:'them',text:'ㅁㅎ',time:timeNow()});showNotice('무지창',['ㅁㅎ'])},2000);setTimeout(()=>{const lines=['야','뒤질래?','내놓으라고황올'];let i=0;const sendNext=()=>{if(i>=lines.length){bootNoticesDone=true;return}messages.ha.push({from:'them',text:lines[i++],time:timeNow()});showNotice('금시완',[lines[i-1]]);if(i<lines.length)setTimeout(sendNext,2000)};sendNext()},15000)},0)}
}
function showNotice(name,lines){const box=$('#noticeStack');if(!box)return;const n=document.createElement('div');n.className='notice';n.innerHTML=`<b>${escapeHTML(name)}</b>${lines.map(escapeHTML).join('<br>')}`;box.appendChild(n);setTimeout(()=>{n.style.transition='opacity .5s';n.style.opacity='0';setTimeout(()=>n.remove(),550)},7000)}
function renderHome(){
 activeApp=null;stack=[];$('#nav').style.display='flex';$('#view').className='view homewall';
 $('#view').innerHTML=`<div class="home-top"><div class="clock-big" id="homeClock">9:41</div><div class="date" id="homeDate">10월 19일 월요일</div><div class="weather">서울<br><span style="font-size:25px">19°</span><br>맑음</div></div><div class="appgrid">${apps.slice(0,6).map(appButton).join('')}</div><div class="dock">${apps.slice(6).map(appButton).join('')}</div>`;
 bindApps();updateClock();
}
function $$(s){return [...document.querySelectorAll(s)]}
function updateClock(){const d=new Date();const t=d.toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit',hour12:false});$('#statusTime').textContent=t;if($('#homeClock'))$('#homeClock').textContent=t;if($('#lockTime'))$('#lockTime').textContent=t;if($('#homeDate'))$('#homeDate').textContent=d.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'})}
setInterval(updateClock,10000);
function bindApps(){$$('[data-app]').forEach(b=>b.onclick=()=>openApp(b.dataset.app))}
function openApp(id){stack=[];activeApp=id;renderApp()}
function goBack(){if(!unlocked)return;if(chatChapterBusy)return;if(stack.length){stack.pop();renderApp()}else if(activeApp){activeApp=null;renderHome()}}
function goHome(){goBack()}
function pushScreen(fn){stack.push(fn);renderApp()}
function appHead(title){return `<div class="apphead"><h2>${title}</h2><span class="subtle" style="font-size:11px">← 스와이프</span></div>`}
function appShell(title,body,composer=''){ $('#nav').style.display='flex';$('#view').className='view appview';$('#view').innerHTML=appHead(title)+`<div class="content" id="content">${body}</div>`+composer;}
function renderApp(){
 if(!activeApp){renderHome();return}
 const app=apps.find(a=>a.id===activeApp);if(!app)return;
 if(stack.length){stack[stack.length-1]();return}
 const c=$('#view');
 if(activeApp==='messages')return renderMessagesList();
 if(activeApp==='contacts')return renderContacts();
 if(activeApp==='phone')return renderPhone();
 if(activeApp==='gallery')return renderGallery();
 if(activeApp==='notes')return renderNotes();
 if(activeApp==='calendar')return renderCalendar();
 if(activeApp==='clock')return renderClock();
 if(activeApp==='music')return renderMusic();
 if(activeApp==='internet')return renderInternet();
}
function renderMessagesList(){
 appShell('메시지',people.map(p=>`<button class="itembtn" data-person="${p.id}"><span class="person">${p.initial}</span><span class="grow"><b>${p.name}</b><div class="subtle">${(messages[p.id]||[]).slice(-1)[0]?.text||'대화 시작하기'}</div></span><span class="subtle">›</span></button>`).join(''));
 $$('[data-person]').forEach(b=>b.onclick=()=>{selectedPerson=b.dataset.person;pushScreen(()=>renderChat(selectedPerson))});
}
function renderChat(id){
 const p=people.find(x=>x.id===id),log=messages[id]||[];
 const composer=`<form class="composer" id="sendForm"><input id="messageInput" placeholder="문자 메시지" autocomplete="off"><button class="send">전송</button></form>`;
 const rendered=log.map((m,i)=>`${id==='min'&&i===11?'<div class="day-divider">10월 11일</div>':''}<div class="bubble ${m.from==='me'?'me':'them'}">${escapeHTML(m.text)}<small>${m.time||timeNow()}</small></div>`).join('');
 appShell(p.name,`<div class="chatlog">${rendered}</div>`,composer);
 const content=$('#content');content.scrollTop=content.scrollHeight;
 $('#sendForm').onsubmit=e=>{e.preventDefault();if(chatChapterBusy)return;const input=$('#messageInput'),text=input.value.trim();if(!text)return;messages[id].push({from:'me',text,time:timeNow()});input.value='';sentCount++;const lower=text.toLowerCase();runScriptedReply(id,lower);};
}
function addThem(id,text){messages[id].push({from:'them',text,time:timeNow()});if(activeApp==='messages'&&stack.length){renderChat(id);if(chatChapterBusy)setComposerEnabled(false)}else toast(`${people.find(p=>p.id===id).name}에게 새 메시지가 도착했습니다`)}
function runScriptedReply(id,text){
 const bad=/(ㅅㅂ|ㅆㅂ|시발|씨발|ㅂㅅ)/i.test(text);
 const why=/(왜|왱|엉|ㅇ\?|응\?)/i.test(text);
 const what=/(뭐해|뭐함|머해|ㅁㅎ)/i.test(text);
 const sorry=/(미안|미아내|쏘리|죄송|ㅈㅅ|지송)/i.test(text);
 const mu=/(무지창)/i.test(text);
 const mentionJun=/(삿가심)/i.test(text);
 const greeting=/(^|\s)(야|님|지창아|무지창|가심아|삿가심|시완아|금시완)(\s|$)/i.test(text) || /^(야|님|지창아|무지창|가심아|삿가심|시완아|금시완)$/.test(text.trim());
 const insult=/새끼야/i.test(text);
 const choose=a=>a[Math.floor(Math.random()*a.length)];
 if(id==='min'){
  if(bad){scriptLines(id,['오우','왜욕을 ㅠㅠ']);return}
  if(insult){scriptLines(id,['뭐 ㅡㅡ']);return}
  if(why){scriptWithDirect(id,['오늘 너네집 가서 잘래'],'구라띠 ㅋ');return}
  if(mentionJun){scriptLines(id,['아….','걔얘긴왜해','아몰라 ㅅㅂ','힘들다 ㅋ']);return}
  if(greeting){scriptLines(id,[choose(['ㅇ?','넵?','웅'])]);return}
  const fallback=['뭐임마','냐냥뇨뇨뇽','ㅋ','아심심하네','쩝…'];scriptLines(id,[fallback[Math.floor(Math.random()*fallback.length)]]);return;
 }
 if(id==='jun'){
  if(bad){scriptWithDirect(id,['말 이쁘게 해 ㅡㅡ'],'니 사람될 때까지 연락 안봄수고');return}
  if(insult){scriptLines(id,['?']);return}
  if(sorry){scriptLines(id,['ㅋ','봐주까','응안봐줘']);return}
  if(mu){scriptLines(id,['흠','무지창 걔 이상해여튼','도플갱언가 ㄷㄷ']);return}
  if(what){scriptLines(id,['잠','졸려','답장은 ㄴㄴ']);return}
  if(greeting){scriptLines(id,[choose(['ㅇㅇ','왜?','그래…'])]);return}
  scriptLines(id,['또 쓸데없는 소리하네','아 걍 잘래']);return;
 }
 if(id==='ha'){
  if(bad){scriptLines(id,['도둑놈아','개뻔뻔하게욕이나옴?','진짜사과해','개나쁜새키']);return}
  if(insult){scriptLines(id,['뭐새끼야 ㅋ']);return}
  if(/리니님|리니쨩|리니/i.test(text)){scriptLines(id,[choose(['헐리니님아시는구나','리니쨩사랑해♡','너 설마 리니 좋아하냐?'])]);return}
  if(/양정민|정민/i.test(text)){scriptLines(id,[choose(['너 그사람 알아?','ㅋㅋ;;;','내가 사랑하는사람이름 함부러 말하지마라'])]);return}
  if(sorry){scriptLines(id,['말이먄 다인 줄 알지?','당장 우리집으로','배달진행시켜']);return}
  if(why){scriptWithTwoDirect(id,['고따구로 답장하지마라'],'어앞으로 니랑 경쟁 안해','이제부터 님 연락은 안봅니다');return}
  if(greeting){scriptLines(id,[choose(['엉','ㅇ','ㅇㅇ'])]);return}
  const fallback=['아몰라끄져','됐어','응아니야','개배고파','너때매 아사함'];scriptLines(id,[fallback[Math.floor(Math.random()*fallback.length)]]);return;
 }
}
function scriptLines(id,lines){chatChapterBusy=true;setComposerEnabled(false);let i=0;const next=()=>{if(i>=lines.length){chatChapterBusy=false;setComposerEnabled(true);renderChat(id);return}addThem(id,lines[i++]);setTimeout(next,2000)};setTimeout(next,2000)}
function scriptWithDirect(id,before,after){chatChapterBusy=true;setComposerEnabled(false);let i=0;const next=()=>{if(i<before.length){addThem(id,before[i++]);setTimeout(next,2000);return}chatChapterBusy=false;pendingDirect={id,after};renderChat(id);const form=$('#sendForm'),input=$('#messageInput');input.placeholder='직접 답장 입력';form.onsubmit=e=>{e.preventDefault();const value=input.value.trim();if(!value)return;messages[id].push({from:'me',text:value,time:timeNow()});pendingDirect=null;chatChapterBusy=true;setComposerEnabled(false);renderChat(id);setTimeout(()=>{addThem(id,after);chatChapterBusy=false;renderChat(id)},2000)};};setTimeout(next,2000)}
function scriptWithTwoDirect(id,before,middle,after){chatChapterBusy=true;setComposerEnabled(false);let i=0;const next=()=>{if(i<before.length){addThem(id,before[i++]);setTimeout(next,2000);return}chatChapterBusy=false;renderChat(id);const form=$('#sendForm'),input=$('#messageInput');if(!form||!input)return;input.placeholder='직접 답장 입력';form.onsubmit=e=>{e.preventDefault();const value=input.value.trim();if(!value)return;messages[id].push({from:'me',text:value,time:timeNow()});input.value='';chatChapterBusy=true;setComposerEnabled(false);let j=0;const deliver=()=>{if(j===0){addThem(id,middle);j++;setTimeout(()=>{chatChapterBusy=false;renderChat(id);const f=$('#sendForm'),inp=$('#messageInput');if(!f||!inp)return;inp.placeholder='직접 답장 입력';f.onsubmit=ev=>{ev.preventDefault();const v=inp.value.trim();if(!v)return;messages[id].push({from:'me',text:v,time:timeNow()});chatChapterBusy=true;setComposerEnabled(false);setTimeout(()=>{addThem(id,after);chatChapterBusy=false;renderChat(id)},2000)}},2000)}};deliver()};};setTimeout(next,2000)}
function setComposerEnabled(enabled){const input=$('#messageInput'),button=$('#sendForm button');if(input)input.disabled=!enabled;if(button)button.disabled=!enabled}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderContacts(){appShell('연락처',people.map(p=>`<button class="itembtn" data-contact="${p.id}"><span class="person">${p.initial}</span><span class="grow"><b>${p.name}</b><div class="subtle">${p.desc}</div></span>›</button>`).join(''));$$('[data-contact]').forEach(b=>b.onclick=()=>pushScreen(()=>contactDetail(b.dataset.contact)))}
function contactDetail(id){let p=people.find(x=>x.id===id);appShell('연락처',`<div style="text-align:center;padding:25px"><div style="font-size:64px">${p.initial}</div><h2>${p.name}</h2><div class="subtle">${p.desc}</div><div style="display:flex;gap:8px;justify-content:center;margin-top:20px"><button class="primary" id="msgPerson">메시지</button><button class="secondary" id="callPerson">전화</button></div></div>`);$('#msgPerson').onclick=()=>{activeApp='messages';stack=[];selectedPerson=id;pushScreen(()=>renderChat(id))};$('#callPerson').onclick=()=>startCall(p.name)}
function renderPhone(){appShell('전화',`<div style="text-align:center;padding:8px"><div class="subtle">전화번호</div><div id="dialNumber" style="font-size:28px;min-height:40px;margin:8px"></div><div class="keypad">${['1','2','3','4','5','6','7','8','9','*','0','#'].map(n=>`<button data-key="${n}">${n}</button>`).join('')}</div><button class="primary" id="callBtn" style="width:65%;padding:14px">☎ 전화 걸기</button><h3 style="text-align:left;margin-top:24px">최근 통화</h3>${calls.slice(-4).reverse().map(c=>`<div class="contactline">${c.name}<span class="subtle" style="float:right">${c.time}</span></div>`).join('')||'<div class="subtle">통화 기록이 없습니다.</div>'}</div>`);let num='';$$('[data-key]').forEach(b=>b.onclick=()=>{$('#dialNumber').textContent=num+=b.dataset.key});$('#callBtn').onclick=()=>{if(!num){toast('번호를 입력하세요');return}startCall(num)}}
function startCall(name){pushScreen(()=>{appShell('통화 중',`<div style="text-align:center;padding:60px 10px"><div style="font-size:58px">☎</div><h2>${escapeHTML(name)}</h2><p class="subtle" id="callStatus">연결 중…</p><button class="primary" id="endCall" style="background:#ed4b54;border-radius:50%;width:70px;height:70px;font-size:25px;margin-top:35px">☎</button></div>`);$('#endCall').onclick=()=>{calls.push({name,time:timeNow()});goBack();toast('통화가 종료되었습니다')}})}
function renderGallery(){appShell('사진',`<div class="subtle" style="margin-bottom:12px">최근 항목 · 6장</div><div class="gallery">${['🌅','🐈','🌃','🍰','🌊','🌷'].map((x,i)=>`<button class="photo" data-photo="${i}">${x}</button>`).join('')}</div>`);$$('[data-photo]').forEach(b=>b.onclick=()=>pushScreen(()=>{appShell('사진',`<div style="height:100%;display:flex;align-items:center;justify-content:center"><div style="font-size:100px">${['🌅','🐈','🌃','🍰','🌊','🌷'][+b.dataset.photo]}</div></div><div class="subtle" style="text-align:center">사진 ${+b.dataset.photo+1} / 6</div>`)}))}
function renderNotes(){appShell('메모',`<div class="card"><div class="subtle">나의 메모</div><textarea class="field" id="noteText" placeholder="메모를 작성하세요...">${escapeHTML(notes)}</textarea><button class="primary" id="saveNote" style="margin-top:10px">임시 저장</button><p class="subtle">새로고침하면 메모가 초기화됩니다.</p></div>`);$('#saveNote').onclick=()=>{notes=$('#noteText').value;toast('이 기기 화면에서 임시 저장했어요')}} 
function renderCalendar(){const d=new Date();appShell('캘린더',`<div class="card"><div style="font-size:23px;font-weight:700">${d.getFullYear()}년 ${d.getMonth()+1}월</div><div class="subtle" style="margin:12px 0">월 · 화 · 수 · 목 · 금 · 토 · 일</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:7px;text-align:center">${Array.from({length:31},(_,i)=>`<div style="padding:7px 0;border-radius:50%;${i+1===d.getDate()?'background:#1685ff;color:white;font-weight:700':''}">${i+1}</div>`).join('')}</div></div><div class="card"><b>예정된 일정</b><p class="subtle">등록된 일정이 없습니다.</p></div>`)}
function renderClock(){appShell('시계',`<div class="bigtime" id="clockNow">9:41:00</div><div class="card"><b>알람</b><div class="row" style="margin-top:12px"><span class="grow">오전 7:00</span><input type="checkbox" id="alarmToggle"></div><div class="subtle">알람은 화면 시뮬레이션용입니다.</div></div><div class="card"><b>스톱워치</b><div id="stopwatch" style="font-size:30px;margin:12px 0">00:00.0</div><button class="primary" id="swStart">시작</button> <button class="secondary" id="swReset">초기화</button></div>`);let running=false,start=0,elapsed=0,timer;const draw=()=>$('#stopwatch').textContent=(elapsed/1000).toFixed(1).padStart(4,'0');$('#swStart').onclick=()=>{running=!running;if(running){start=Date.now()-elapsed;timer=setInterval(()=>{elapsed=Date.now()-start;draw()},100)}else clearInterval(timer);$('#swStart').textContent=running?'정지':'시작'};$('#swReset').onclick=()=>{running=false;clearInterval(timer);elapsed=0;draw();$('#swStart').textContent='시작'};const update=()=>{if($('#clockNow'))$('#clockNow').textContent=new Date().toLocaleTimeString('ko-KR',{hour12:false})};update();setInterval(update,1000)}
function renderMusic(){appShell('음악',`<div class="card" style="text-align:center;padding:30px 15px"><div style="font-size:80px">🎵</div><h3>나의 플레이리스트</h3><p class="subtle">가상의 음악 플레이어</p><div id="trackName" style="font-weight:600;margin:18px">01 · Blue Hour</div><button class="primary" id="playMusic">▶ 재생</button><div class="subtle" style="margin-top:12px">실제 음원은 재생하지 않습니다.</div></div>${['Blue Hour','Night Walk','After Rain'].map((t,i)=>`<button class="itembtn" data-track="${t}">♫ <span class="grow">${t}</span><span class="subtle">3:${12+i*8}</span></button>`).join('')}`);let playing=false;$('#playMusic').onclick=()=>{playing=!playing;$('#playMusic').textContent=playing?'Ⅱ 일시정지':'▶ 재생'};$$('[data-track]').forEach(b=>b.onclick=()=>{$('#trackName').textContent=b.dataset.track;playing=false;$('#playMusic').textContent='▶ 재생'})}
function renderInternet(){appShell('인터넷',`<form id="searchForm" class="row"><input class="field" id="searchText" placeholder="검색어 또는 주소"><button class="primary">이동</button></form><div class="card" style="margin-top:14px"><div style="font-size:35px;text-align:center">🌐</div><h3>인터넷</h3><p class="subtle">가상 브라우저입니다. 외부 사이트를 실제로 불러오지는 않습니다.</p></div><div id="searchResult"></div>`);$('#searchForm').onsubmit=e=>{e.preventDefault();let q=$('#searchText').value.trim();$('#searchResult').innerHTML=`<div class="card"><b>${escapeHTML(q||'검색')}</b><p class="subtle">검색 결과를 표시하는 대신 캐릭터의 휴대폰 안에서만 작동합니다.</p></div>`}}
// 옆으로 스와이프하면 뒤로 이동합니다. 최근 앱/홈/나가기 버튼은 없습니다.
$('#view').addEventListener('touchstart',e=>{swipeStart={x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY}},{passive:true});
$('#view').addEventListener('touchend',e=>{if(!swipeStart)return;const dx=e.changedTouches[0].clientX-swipeStart.x,dy=e.changedTouches[0].clientY-swipeStart.y;if(Math.abs(dx)>75&&Math.abs(dx)>Math.abs(dy)*1.25)goBack();swipeStart=null},{passive:true});
$('#view').addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')swipeStart={x:e.clientX,y:e.clientY}});$('#view').addEventListener('pointerup',e=>{if(!swipeStart||e.pointerType!=='mouse')return;const dx=e.clientX-swipeStart.x,dy=e.clientY-swipeStart.y;if(Math.abs(dx)>90&&Math.abs(dx)>Math.abs(dy))goBack();swipeStart=null});
renderLock();
</script>
</body></html>
